name: CI

on:
  push:
    branches: [main, 'agent/**', 'hotfix/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Bundle Cloudflare Pages Functions
        run: npx --yes wrangler@3.114.17 pages functions build functions --outfile=/tmp/pages-worker.js
